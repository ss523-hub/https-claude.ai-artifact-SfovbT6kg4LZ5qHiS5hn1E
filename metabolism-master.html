.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--pn);border:3px solid var(--bd);border-radius:14px;padding:8px 12px;font-weight:700}
button{font:inherit;font-weight:700;border:3px solid var(--bd);background:var(--y);color:#1c3a2a;border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 var(--bd)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bd)}button:focus-visible,.card:focus-visible,.slot:focus-visible{outline:3px solid #ff7a00}
.panel{background:var(--pn);border:3px solid var(--bd);border-radius:16px;padding:12px;margin-top:10px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.card{border:3px solid var(--bd);border-radius:12px;padding:8px 10px;font-weight:700;cursor:grab;user-select:none;color:#1c3a2a;touch-action:manipulation}
.card.sel{outline:4px solid #ff7a00;transform:scale(1.06)}
.y{background:var(--y)}.b{background:var(--b)}.g{background:var(--g)}.p{background:var(--p)}
.field{text-align:center}.t{font-weight:700;margin:6px 0}.arrow{font-size:1.4rem;margin:4px 0}
.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.slot{min-width:92px;min-height:48px;border:3px dashed var(--bd);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:4px}
.slot.over{background:#ffd9a0}.slot .card{cursor:pointer;margin:0}
.proc{display:inline-block;background:var(--g);color:#1c3a2a;border:3px solid var(--bd);border-radius:999px;padding:6px 18px;font-weight:700}
#msg{text-align:center;font-weight:700;font-size:1.2rem;min-height:1.6em;margin-top:8px}.ok{color:var(--ok)}.ng{color:var(--ng)}
#ex{margin-top:6px;white-space:pre-line}.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.small{font-size:.85rem}.tm{display:flex;gap:6px;align-items:center}
.q{font-weight:700;margin-bottom:10px;text-align:left}.dia{display:flex;align-items:center;justify-content:center;gap:6px}
.col{display:flex;flex-direction:column;gap:6px;align-items:center}.ar{font-size:1.3rem}.dn{font-size:1.5rem;margin:6px 0 2px}
.slot:empty::before{content:"？";font-size:1.4rem;opacity:.5}.card.fx{cursor:default;border-style:solid;opacity:.95}

.fw{overflow-x:auto}.fg{position:relative;min-width:680px}.fg svg{width:100%;height:100%;display:block}

else if(k==='o')sv+='<circle class="dot" cx="'+a[1]+'" cy="'+a[2]+'" r="5"/>';
else if(k==='s'){const n=G.push(a[3])-1;GR[n]=a[4]||'';sl+='<div class="slot" data-g="'+n+'"'+(a[5]?' data-c="'+a[5]+'"':'')+' tabindex="0" style="left:'+(a[1]/W*100)+'%;top:'+(a[2]/F.H*100)+'%"></div>'}});
f.innerHTML='<div class="q">❓ '+s.q+'</div><div class="fw"><div class="fg" style="aspect-ratio:'+W+'/'+F.H+'"><svg viewBox="0 0 '+W+' '+F.H+'"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>'+sv+'</svg>'+sl+'</div></div>';
trimAll();f.querySelectorAll('.slot').forEach(sl=>{
sl.ondragover=e=>{e.preventDefault();sl.classList.add('over')};sl.ondragleave=()=>sl.classList.remove('over');
sl.ondrop=e=>{e.preventDefault();sl.classList.remove('over');if(!done)put(sl,e.dataTransfer.getData('text/plain'))};
sl.onclick=()=>{if(done)return;if(sel)put(sl,sel);else put(sl,null)}});
$('msg').textContent='';$('msg').className='';$('ex').hidden=true;$('nxt').hidden=true;$('chk').hidden=false;
done=false;tries=0;hinted=false;t0=Date.now();
}
function trimAll(){const fg=document.querySelector('.fg');if(!fg)return;const fr=fg.getBoundingClientRect(),k=780/fr.width,B=[];
fg.querySelectorAll('.slot').forEach(s=>{const r=s.getBoundingClientRect();B.push([(r.left-fr.left)*k-5,(r.top-fr.top)*k-5,(r.right-fr.left)*k+5,(r.bottom-fr.top)*k+5])});
fg.querySelectorAll('svg rect,svg ellipse').forEach(e=>{const b=e.getBBox();B.push([b.x-4,b.y-4,b.x+b.width+4,b.y+b.height+4])});
const In=p=>B.some(b=>p[0]>b[0]&&p[0]<b[2]&&p[1]>b[1]&&p[1]<b[3]);
fg.querySelectorAll('svg [data-o]').forEach(e=>{const P=[],ln=e.tagName==='line';
if(ln){const[a,b,c,d]=e.dataset.o.split(',').map(Number);for(let i=0;i<=80;i++)P.push([a+(c-a)*i/80,b+(d-b)*i/80])}
else{const t=document.createElementNS('http://www.w3.org/2000/svg','path');t.setAttribute('d',e.dataset.o);const L=t.getTotalLength();for(let i=0;i<=80;i++){const q=t.getPointAtLength(L*i/80);P.push([q.x,q.y])}}
while(P.length>3&&In(P[0]))P.shift();while(P.length>3&&In(P[P.length-1]))P.pop();
if(ln){e.setAttribute('x1',P[0][0]);e.setAttribute('y1',P[0][1]);e.setAttribute('x2',P[P.length-1][0]);e.setAttribute('y2',P[P.length-1][1])}else e.setAttribute('d','M'+P.map(p=>p.join(' ')).join('L'))})}
window.addEventListener('resize',trimAll);
function check(){if(done)return;const s=S[i],f=$('field');
const ss=[...f.querySelectorAll('.slot')];tries++;let ng=0;const bad=[],rem={};ss.forEach((x,n)=>{if(GR[n])(rem[GR[n]]=rem[GR[n]]||[]).push(G[n])});
ss.forEach((x,n)=>{const v=x.dataset.k,g=GR[n];let ok;if(g){const a=rem[g],j=a.indexOf(v);ok=j>=0;if(ok)a.splice(j,1)}else ok=v===G[n];x.classList.remove('ok','ng');x.classList.add(ok?'ok':'ng');if(!ok){ng++;if(x.dataset.k)bad.push(x.dataset.k)}});
const m=mem.s[i];m.a++;
if(!ng){m.c++;m.t.push(Math.round((Date.now()-t0)/1000));const pt=tries===1?(hinted?15:25):10;score+=pt;mem.r.push({n:$('nm').value.trim()||'(名前なし)',i:i,p:pt,t:tries,sec:Math.round((Date.now()-t0)/1000)});done=true;beep(true);
$('msg').className='ok';$('msg').textContent='🎉 正解！';$('ex').hidden=false;$('ex').textContent=s.e;
$('chk').hidden=true;$('nxt').hidden=false;$('nxt').textContent=i<S.length-1?'次のステージへ':'最初からもう一度';$('sc').textContent='スコア: '+score+'点'}
else{bad.forEach(k=>mem.w[k]=(mem.w[k]||0)+1);beep(false);$('msg').className='ng';$('msg').textContent='❌ '+ng+'か所ちがうよ（赤い枠）。緑の枠はOK！もう一度考えよう'}
save();if($('tm').checked)teacher()}
function teacher(){const t=$('teacher');t.hidden=!$('tm').checked;if(t.hidden)return;
const rows=S.map((s,j)=>{const m=mem.s[j],av=m.t.length?Math.round(m.t.reduce((x,y)=>x+y,0)/m.t.length)+'秒':'-';
return `<tr><td>${s.n}</td><td>${m.a?Math.round(m.c/m.a*100)+'%':'-'} (${m.c}/${m.a})</td><td>${av}</td></tr>`}).join('');
const w=Object.entries(mem.w).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,n])=>lab(k)+'（'+n+'回）').join('、')||'まだデータなし';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),by={};mem.r.forEach(r=>{(by[r.n]=by[r.n]||{})[r.i]=r});
const rec='<p><b>この端末の記録（名前別）</b></p><table style="width:100%;border-collapse:collapse;text-align:left"><tr><th>名前</th><th>クリア</th><th>合計点</th></tr>'+(Object.entries(by).map(([n,o])=>{const v=Object.values(o);return '<tr><td>'+esc(n)+'</td><td>'+v.length+'/'+S.length+'</td><td>'+v.reduce((a,r)=>a+r.p,0)+'点</td></tr>'}).join('')||'<tr><td colspan="3">まだ記録なし</td></tr>')+'</table>';
t.innerHTML='<b>教師モード</b>（この端末の記録）<table style="width:100%;margin-top:6px;border-collapse:collapse;text-align:left"><tr><th>ステージ</th><th>正答率</th><th>平均クリア時間</th></tr>'+rows+'</table><p>間違いやすいカード：'+w+'</p>'+rec+'<button id="rs">記録をリセット</button>';
$('rs').onclick=()=>{mem={s:S.map(()=>({a:0,c:0,t:[]})),w:{},r:[]};save();teacher()}}
$('chk').onclick=check;
$('hint').onclick=()=>{hinted=true;$('msg').className='';$('msg').textContent='💡 ヒント：'+S[i].h};
$('nxt').onclick=()=>{if(i<S.length-1)i++;else{i=0;score=0}render()};
$('tm').onchange=teacher;
load();mem.r=mem.r||[];pool();render();
(function(){try{$('nm').value=localStorage.getItem('metaNm')||''}catch(e){}
$('nm').oninput=()=>{try{localStorage.setItem('metaNm',$('nm').value)}catch(e){}};
$('sub').onclick=()=>{const nm=$('nm').value.trim()||'(名前なし)',L=['名前：'+nm];let tot=0;
S.forEach((s,k)=>{const r=[...mem.r].reverse().find(x=>x.i===k&&x.n===nm);if(r){tot+=r.p;L.push('ステージ'+(k+1)+' '+s.n.split(' ')[1]+'：'+r.p+'点（'+r.t+'回目で正解・'+r.sec+'秒）')}else L.push('ステージ'+(k+1)+' '+s.n.split(' ')[1]+'：まだ')});
L.splice(1,0,'合計：'+tot+'点');$('sbt').value=L.join('\n');$('cpm').textContent='';$('sb').hidden=false};
$('cp').onclick=()=>{$('sbt').select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}$('cpm').textContent=ok?'コピーしたよ！':'選んだ文章を、長押し（またはCtrl+C）でコピーしてね'};
$('sbx').onclick=()=>{$('sb').hidden=true}})();
(function(){$('tm').parentElement.style.display='none';const h1=document.querySelector('h1');let n=0,t;
function unlock(){let pw=null;try{pw=localStorage.getItem('metaPw')}catch(e){}
const b=$('pw'),i=$('pwi');$('pwl').textContent=pw?'教師用パスワード':'教師用パスワードを決めてください（この端末だけに保存されます）';b.hidden=false;i.value='';i.focus();
i.onkeydown=e=>{if(e.key==='Enter')$('pwok').click()};
$('pwok').onclick=()=>{const v=i.value;if(!v)return;if(!pw){try{localStorage.setItem('metaPw',v)}catch(e){}pw=v}
if(v!==pw){$('pwl').textContent='パスワードがちがいます';i.value='';return}b.hidden=true;$('tm').checked=true;teacher()};
$('pwno').onclick=()=>{b.hidden=true}}
h1.onclick=()=>{n++;clearTimeout(t);t=setTimeout(()=>{n=0},2000);if(n<5)return;n=0;
if($('tm').checked){$('tm').checked=false;teacher();return}unlock()}})();
</script></body></html>
